<svg xmlns="http://www.w3.org/2000/svg" width="720" height="900" viewBox="0 0 720 900" role="img" aria-label="Teknisk illustrasjon: tak med ståsøm og membranoppbygging" preserveAspectRatio="xMidYMid slice">
  <defs>
    <clipPath id="gable"><path d="M360 150 L80 470 L640 470 Z"/></clipPath>
    <linearGradient id="hpbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1712"/><stop offset="1" stop-color="#141009"/>
    </linearGradient>
    <filter id="hp-grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="matrix" values="0 0 0 0 0.93 0 0 0 0 0.9 0 0 0 0 0.83 0 0 0 0.03 0"/></filter>
  </defs>

  <rect width="720" height="900" fill="url(#hpbg)"/>

  <!-- coordinate ticks (blueprint feel) -->
  <g stroke="#efe8db" stroke-width="1" opacity="0.16">
    <line x1="40" y1="70" x2="680" y2="70"/>
    <line x1="40" y1="70" x2="40" y2="830"/>
    <line x1="680" y1="70" x2="680" y2="830"/>
  </g>
  <g fill="#efe8db" opacity="0.4" font-family="ui-monospace, monospace" font-size="12" letter-spacing="1">
    <text x="52" y="60">TAK · DETALJ 01</text>
    <text x="560" y="60">5514 HGSD</text>
  </g>

  <!-- Gable planes -->
  <g clip-path="url(#gable)">
    <rect x="80" y="150" width="560" height="320" fill="#e7ddc9"/>
    <!-- shade on left plane -->
    <path d="M360 150 L80 470 L360 470 Z" fill="#181310" opacity="0.16"/>
    <!-- standing seams -->
    <g stroke="#4a3f30" stroke-width="2" opacity="0.9">
      <line x1="120" y1="150" x2="120" y2="470"/><line x1="160" y1="150" x2="160" y2="470"/>
      <line x1="200" y1="150" x2="200" y2="470"/><line x1="240" y1="150" x2="240" y2="470"/>
      <line x1="280" y1="150" x2="280" y2="470"/><line x1="320" y1="150" x2="320" y2="470"/>
      <line x1="360" y1="150" x2="360" y2="470"/><line x1="400" y1="150" x2="400" y2="470"/>
      <line x1="440" y1="150" x2="440" y2="470"/><line x1="480" y1="150" x2="480" y2="470"/>
      <line x1="520" y1="150" x2="520" y2="470"/><line x1="560" y1="150" x2="560" y2="470"/>
      <line x1="600" y1="150" x2="600" y2="470"/>
    </g>
    <!-- seam highlights -->
    <g stroke="#fbf6ec" stroke-width="1" opacity="0.5">
      <line x1="122" y1="150" x2="122" y2="470"/><line x1="242" y1="150" x2="242" y2="470"/>
      <line x1="402" y1="150" x2="402" y2="470"/><line x1="562" y1="150" x2="562" y2="470"/>
    </g>
    <!-- roof window -->
    <g>
      <rect x="452" y="300" width="66" height="80" rx="3" fill="#20303a"/>
      <rect x="457" y="305" width="56" height="70" rx="2" fill="#3f5866"/>
      <path d="M462 372 L505 312" stroke="#cfe0e8" stroke-width="3" opacity="0.7"/>
    </g>
  </g>

  <!-- ridge caps (rust) -->
  <path d="M360 150 L80 470" fill="none" stroke="#bd4a2b" stroke-width="6" stroke-linecap="round"/>
  <path d="M360 150 L640 470" fill="none" stroke="#bd4a2b" stroke-width="6" stroke-linecap="round"/>
  <circle cx="360" cy="150" r="6" fill="#bd4a2b"/>

  <!-- eave + gutter -->
  <line x1="80" y1="470" x2="640" y2="470" stroke="#efe8db" stroke-width="3"/>
  <rect x="76" y="474" width="568" height="12" rx="6" fill="#2a2219"/>
  <rect x="76" y="474" width="568" height="4" rx="2" fill="#bd4a2b" opacity="0.85"/>

  <!-- leader label to roof window -->
  <g stroke="#efe8db" opacity="0.5"><line x1="518" y1="330" x2="600" y2="300"/><circle cx="518" cy="330" r="2.5" fill="#efe8db"/></g>
  <text x="606" y="300" fill="#efe8db" opacity="0.7" font-family="ui-monospace, monospace" font-size="12">TAKVINDU</text>

  <!-- Membrane build-up detail -->
  <g font-family="ui-monospace, monospace" font-size="13" letter-spacing="0.5">
    <text x="80" y="556" fill="#bd8a2b" opacity="0.9">OPPBYGGING — MEMBRANTAK</text>
    <!-- layers -->
    <g>
      <rect x="80" y="576" width="470" height="26" fill="#c9cdd0"/>
      <rect x="80" y="576" width="470" height="26" fill="#181310" opacity="0.04"/>
      <text x="562" y="594" fill="#efe8db" opacity="0.75">Sarnafil takbelegg</text>

      <rect x="80" y="606" width="470" height="20" fill="#7d5236"/>
      <text x="562" y="621" fill="#efe8db" opacity="0.75">Membran / asfalt</text>

      <rect x="80" y="630" width="470" height="20" fill="#5a4a34"/>
      <text x="562" y="645" fill="#efe8db" opacity="0.6">Undertak</text>

      <rect x="80" y="654" width="470" height="30" fill="#332a1f"/>
      <text x="562" y="673" fill="#efe8db" opacity="0.6">Konstruksjon</text>
    </g>
    <!-- weld seam line -->
    <line x1="80" y1="589" x2="550" y2="589" stroke="#fbf6ec" stroke-width="1.4" opacity="0.5" stroke-dasharray="2 6"/>
  </g>

  <!-- baseline caption -->
  <g font-family="ui-monospace, monospace" font-size="12" letter-spacing="1" fill="#efe8db" opacity="0.4">
    <line x1="80" y1="740" x2="640" y2="740" stroke="#efe8db" opacity="0.18"/>
    <text x="80" y="766">SARNAFIL · ASFALT · BLIKKENSLAG</text>
    <text x="80" y="788">HAUGESUND TAK &amp; TERRASSE AS</text>
  </g>

  <rect width="720" height="900" filter="url(#hp-grain)"/>
</svg>
