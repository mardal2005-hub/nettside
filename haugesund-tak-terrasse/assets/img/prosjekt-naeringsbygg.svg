<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-label="Illustrasjon: næringsbygg med flatt membrantak">
  <defs>
    <linearGradient id="n-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f4a5e"/><stop offset="0.7" stop-color="#7f8f97"/><stop offset="1" stop-color="#cdb48f"/></linearGradient>
    <linearGradient id="n-wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e7ecee"/><stop offset="1" stop-color="#c3cdd2"/></linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#n-sky)"/>
  <circle cx="150" cy="130" r="60" fill="#ffe6bf" opacity="0.7"/>

  <!-- ground -->
  <rect y="470" width="800" height="130" fill="#2b3a44"/>

  <!-- main building block -->
  <rect x="120" y="250" width="420" height="230" fill="url(#n-wall)"/>
  <!-- flat membrane roof slab -->
  <path d="M110 250 L560 250 L590 232 L140 232 Z" fill="#aeb9c0"/>
  <rect x="110" y="248" width="450" height="8" fill="#8a99a3"/>
  <!-- second lower block -->
  <rect x="540" y="330" width="180" height="150" fill="#d3dade"/>
  <path d="M535 330 L725 330 L740 318 L550 318 Z" fill="#9aa5ac"/>
  <rect x="535" y="328" width="190" height="7" fill="#7f8d96"/>

  <!-- windows grid -->
  <g fill="#33475a">
    <rect x="150" y="290" width="60" height="46"/><rect x="230" y="290" width="60" height="46"/><rect x="310" y="290" width="60" height="46"/><rect x="390" y="290" width="60" height="46"/><rect x="470" y="290" width="40" height="46"/>
    <rect x="150" y="360" width="60" height="46"/><rect x="230" y="360" width="60" height="46"/><rect x="310" y="360" width="60" height="46"/><rect x="390" y="360" width="60" height="46"/><rect x="470" y="360" width="40" height="46"/>
  </g>
  <!-- entrance -->
  <rect x="300" y="418" width="70" height="62" fill="#26333d"/>

  <!-- roof units (ventilation) on flat roof -->
  <g fill="#8a99a3">
    <rect x="200" y="214" width="46" height="20"/><rect x="360" y="210" width="40" height="24"/>
  </g>
  <!-- parapet copper accent line -->
  <rect x="110" y="246" width="450" height="3" fill="#c76d2c" opacity="0.8"/>
</svg>
