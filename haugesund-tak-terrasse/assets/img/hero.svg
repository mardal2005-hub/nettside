<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Hus med nytt tak og terrasse i morgenlys" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20313f"/>
      <stop offset="0.45" stop-color="#2f4a5e"/>
      <stop offset="0.78" stop-color="#7b6a63"/>
      <stop offset="1" stop-color="#d9a06a"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c76d2c"/>
      <stop offset="1" stop-color="#a5531f"/>
    </linearGradient>
    <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9814e"/>
      <stop offset="1" stop-color="#8a5c33"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef1f2"/>
      <stop offset="1" stop-color="#cdd6da"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd9a0"/>
      <stop offset="1" stop-color="#ffd9a0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1280" cy="300" r="250" fill="url(#sun)"/>
  <circle cx="1280" cy="300" r="72" fill="#ffe6bf" opacity="0.9"/>

  <!-- Distant hills -->
  <path d="M0 640 Q320 560 640 610 T1600 590 L1600 900 L0 900 Z" fill="#2b3f4d" opacity="0.55"/>
  <path d="M0 705 Q460 630 900 685 T1600 665 L1600 900 L0 900 Z" fill="#243642" opacity="0.7"/>

  <!-- Ground -->
  <rect y="730" width="1600" height="170" fill="#1c2c37"/>

  <!-- Building group, shifted to the right half so the left (behind text) stays clean -->
  <g transform="translate(560,0)">
    <!-- Wall -->
    <rect x="250" y="440" width="470" height="300" fill="url(#wall)"/>
    <!-- Roof (pitched, tiled) -->
    <path d="M215 452 L485 250 L755 452 Z" fill="url(#roof)"/>
    <g stroke="#8f4718" stroke-width="3" opacity="0.5">
      <path d="M275 407 L695 407" fill="none"/>
      <path d="M310 372 L660 372" fill="none"/>
      <path d="M345 337 L625 337" fill="none"/>
      <path d="M380 302 L590 302" fill="none"/>
    </g>
    <!-- gutter -->
    <rect x="215" y="452" width="540" height="12" fill="#e7edef"/>
    <rect x="712" y="464" width="10" height="276" fill="#dbe3e6"/>
    <!-- Windows -->
    <g fill="#33475a">
      <rect x="300" y="500" width="80" height="110" rx="3"/>
      <rect x="430" y="500" width="80" height="110" rx="3"/>
    </g>
    <g stroke="#f2f5f6" stroke-width="4">
      <line x1="340" y1="500" x2="340" y2="610"/>
      <line x1="300" y1="555" x2="380" y2="555"/>
      <line x1="470" y1="500" x2="470" y2="610"/>
      <line x1="430" y1="555" x2="510" y2="555"/>
    </g>
    <!-- Roof window -->
    <rect x="470" y="360" width="66" height="52" rx="4" fill="#8fb9d0" stroke="#7a3f16" stroke-width="4"/>
    <!-- Door -->
    <rect x="590" y="560" width="90" height="180" rx="3" fill="#4a3623"/>
    <circle cx="600" cy="655" r="4" fill="#d9a06a"/>
  </g>

  <!-- Terrace / deck in foreground, right side -->
  <g transform="translate(300,0)">
    <rect x="720" y="600" width="820" height="140" fill="url(#deck)"/>
    <g stroke="#6f4a29" stroke-width="3" opacity="0.6">
      <line x1="720" y1="626" x2="1540" y2="626"/>
      <line x1="720" y1="652" x2="1540" y2="652"/>
      <line x1="720" y1="678" x2="1540" y2="678"/>
      <line x1="720" y1="704" x2="1540" y2="704"/>
    </g>
    <g stroke="#7c5230" stroke-width="7" stroke-linecap="round">
      <line x1="740" y1="600" x2="740" y2="510"/>
      <line x1="900" y1="600" x2="900" y2="510"/>
      <line x1="1060" y1="600" x2="1060" y2="510"/>
      <line x1="1220" y1="600" x2="1220" y2="510"/>
      <line x1="1380" y1="600" x2="1380" y2="510"/>
    </g>
    <rect x="726" y="502" width="810" height="12" rx="6" fill="#9c6a3c"/>
  </g>
</svg>
