<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-label="Flatt tak med membran / takpapp">
  <defs>
    <linearGradient id="s5" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c7d7e0"/><stop offset="1" stop-color="#9bb7c4"/></linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#s5)"/>
  <circle cx="130" cy="130" r="55" fill="#ffe6bf" opacity="0.8"/>
  <!-- flat roof slab in perspective -->
  <path d="M60 470 L300 320 L800 380 L620 560 Z" fill="#2c3742"/>
  <path d="M60 470 L300 320 L320 350 L100 500 Z" fill="#3a4854" opacity="0.7"/>
