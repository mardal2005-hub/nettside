<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Oppsatt festutstyr med telt, bord og stoler" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22406b"/>
      <stop offset="1" stop-color="#16243d"/>
    </linearGradient>
    <linearGradient id="tent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6ecf4"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#243a54"/>
      <stop offset="1" stop-color="#1a2c42"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#sky)"/>
  <circle cx="980" cy="150" r="70" fill="#3b6fb6" opacity="0.35"/>
  <rect y="560" width="1200" height="240" fill="url(#ground)"/>
  <!-- string lights -->
  <path d="M60 120 Q400 220 740 120 T1160 150" stroke="#3b6fb6" stroke-width="2" fill="none" opacity="0.5"/>
  <g fill="#ffe9a8">
    <circle cx="180" cy="168" r="5"/><circle cx="320" cy="188" r="5"/><circle cx="460" cy="188" r="5"/>
    <circle cx="600" cy="170" r="5"/><circle cx="740" cy="150" r="5"/><circle cx="880" cy="150" r="5"/>
    <circle cx="1020" cy="165" r="5"/>
  </g>
  <!-- party tent -->
  <g>
    <path d="M360 560V360h480v200z" fill="url(#tent)"/>
    <path d="M330 360 L600 250 L870 360 Z" fill="#f4f7fb"/>
    <path d="M600 250 L600 560" stroke="#d5deea" stroke-width="2"/>
    <path d="M360 360h480" stroke="#d5deea" stroke-width="3"/>
    <path d="M480 560V400h240v160z" fill="#dfe7f1"/>
    <path d="M360 560V360" stroke="#c9d4e2" stroke-width="6" stroke-linecap="round"/>
    <path d="M840 560V360" stroke="#c9d4e2" stroke-width="6" stroke-linecap="round"/>
  </g>
  <!-- tables and chairs -->
  <g>
    <rect x="150" y="520" width="150" height="18" rx="4" fill="#ffffff"/>
    <rect x="165" y="538" width="8" height="40" rx="3" fill="#c9d4e2"/>
    <rect x="277" y="538" width="8" height="40" rx="3" fill="#c9d4e2"/>
    <rect x="120" y="546" width="26" height="34" rx="4" fill="#3b6fb6"/>
    <rect x="304" y="546" width="26" height="34" rx="4" fill="#3b6fb6"/>
  </g>
  <g>
    <rect x="900" y="520" width="150" height="18" rx="4" fill="#ffffff"/>
    <rect x="915" y="538" width="8" height="40" rx="3" fill="#c9d4e2"/>
    <rect x="1027" y="538" width="8" height="40" rx="3" fill="#c9d4e2"/>
    <rect x="870" y="546" width="26" height="34" rx="4" fill="#3b6fb6"/>
    <rect x="1054" y="546" width="26" height="34" rx="4" fill="#3b6fb6"/>
  </g>
  <!-- speaker -->
  <g>
    <rect x="1080" y="440" width="70" height="140" rx="8" fill="#1a2c42" stroke="#3b6fb6" stroke-width="2"/>
    <circle cx="1115" cy="480" r="16" fill="#22406b" stroke="#3b6fb6" stroke-width="2"/>
    <circle cx="1115" cy="540" r="22" fill="#22406b" stroke="#3b6fb6" stroke-width="2"/>
  </g>
</svg>
