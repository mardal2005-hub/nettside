<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-label="Moderne norsk bolig i mørkt trepanel ved skumring">
  <defs>
    <linearGradient id="hSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9b79c"/>
      <stop offset="0.45" stop-color="#d8c6a9"/>
      <stop offset="1" stop-color="#e7dac2"/>
    </linearGradient>
    <linearGradient id="hGround" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9a888"/>
      <stop offset="1" stop-color="#a08c6b"/>
    </linearGradient>
    <linearGradient id="hWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a231c"/>
      <stop offset="1" stop-color="#1c1712"/>
    </linearGradient>
    <linearGradient id="hGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4ead2"/>
      <stop offset="1" stop-color="#c99f5f"/>
    </linearGradient>
    <linearGradient id="hHill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a876a"/>
      <stop offset="1" stop-color="#8a7658"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#hSky)"/>

  <!-- sun glow -->
  <circle cx="1430" cy="360" r="220" fill="#f0e2c4" opacity="0.55"/>
  <circle cx="1430" cy="360" r="120" fill="#f6ecd4" opacity="0.6"/>

  <!-- distant hills -->
  <path d="M0 560 C 320 500 560 540 820 520 C 1120 495 1400 545 1920 500 L1920 720 L0 720 Z" fill="url(#hHill)" opacity="0.7"/>
  <path d="M0 610 C 380 575 700 605 1040 585 C 1380 566 1650 600 1920 575 L1920 760 L0 760 Z" fill="#8f7c5d" opacity="0.85"/>

  <!-- treeline -->
  <g fill="#5f5340" opacity="0.65">
    <path d="M120 600 l22 -70 22 70 z"/><path d="M170 605 l26 -86 26 86 z"/>
    <path d="M230 602 l20 -62 20 62 z"/><path d="M1720 596 l24 -78 24 78 z"/>
    <path d="M1770 602 l20 -64 20 64 z"/><path d="M1660 604 l18 -56 18 56 z"/>
  </g>

  <!-- ground -->
  <rect y="700" width="1920" height="380" fill="url(#hGround)"/>

  <!-- house -->
  <g>
    <!-- roof -->
    <path d="M470 430 L1080 300 L1450 430 Z" fill="#171310"/>
    <!-- main volume -->
    <rect x="520" y="425" width="820" height="330" fill="url(#hWall)"/>
    <!-- lower wing -->
    <rect x="1290" y="540" width="360" height="215" fill="#221c16"/>
    <path d="M1290 540 L1470 470 L1650 540 Z" fill="#151109"/>

    <!-- vertical cladding lines -->
    <g stroke="#000" stroke-opacity="0.28" stroke-width="2">
      <line x1="560" y1="430" x2="560" y2="755"/><line x1="600" y1="430" x2="600" y2="755"/>
      <line x1="640" y1="430" x2="640" y2="755"/><line x1="680" y1="430" x2="680" y2="755"/>
      <line x1="720" y1="430" x2="720" y2="755"/><line x1="760" y1="430" x2="760" y2="755"/>
      <line x1="1120" y1="430" x2="1120" y2="755"/><line x1="1160" y1="430" x2="1160" y2="755"/>
      <line x1="1200" y1="430" x2="1200" y2="755"/><line x1="1240" y1="430" x2="1240" y2="755"/>
    </g>

    <!-- large glazing -->
    <rect x="800" y="470" width="270" height="240" fill="url(#hGlass)"/>
    <line x1="935" y1="470" x2="935" y2="710" stroke="#1c1712" stroke-width="6"/>
    <line x1="800" y1="590" x2="1070" y2="590" stroke="#1c1712" stroke-width="6"/>
    <rect x="800" y="470" width="270" height="240" fill="none" stroke="#0f0c09" stroke-width="8"/>

    <!-- lower wing window -->
    <rect x="1360" y="585" width="210" height="120" fill="url(#hGlass)"/>
    <line x1="1465" y1="585" x2="1465" y2="705" stroke="#1c1712" stroke-width="5"/>
    <rect x="1360" y="585" width="210" height="120" fill="none" stroke="#0f0c09" stroke-width="6"/>

    <!-- door slit -->
    <rect x="620" y="560" width="70" height="195" fill="#3b2f22"/>
    <rect x="620" y="560" width="70" height="195" fill="none" stroke="#0f0c09" stroke-width="6"/>
  </g>

  <!-- foreground shadow -->
  <ellipse cx="1020" cy="770" rx="640" ry="40" fill="#000" opacity="0.12"/>

  <!-- subtle grain -->
  <rect width="1920" height="1080" fill="#000" opacity="0.03"/>
</svg>
