<svg width="1600" height="1000" viewBox="0 0 1600 1000" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b3a5b"/>
      <stop offset="0.55" stop-color="#12283f"/>
      <stop offset="1" stop-color="#0d1f31"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16293c"/>
      <stop offset="1" stop-color="#0b1826"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <circle cx="1230" cy="250" r="180" fill="#20456a" opacity="0.5"/>
  <circle cx="1230" cy="250" r="110" fill="#2a557f" opacity="0.4"/>
  <!-- distant crane booms -->
  <g stroke="#2f88cf" stroke-width="6" opacity="0.35">
    <line x1="120" y1="640" x2="640" y2="150"/>
    <line x1="140" y1="640" x2="660" y2="150"/>
    <line x1="1480" y1="620" x2="980" y2="180"/>
  </g>
  <rect y="700" width="1600" height="300" fill="url(#ground)"/>
  <!-- three crane trucks silhouettes -->
  <g fill="#0a1725">
    <!-- truck 1 -->
    <rect x="180" y="600" width="360" height="110" rx="6"/>
    <rect x="180" y="560" width="120" height="70" rx="6"/>
    <rect x="430" y="560" width="60" height="20" rx="3" fill="#2f88cf" opacity="0.6"/>
    <circle cx="250" cy="720" r="34"/><circle cx="470" cy="720" r="34"/>
    <!-- truck 2 -->
    <rect x="620" y="580" width="380" height="130" rx="6"/>
    <rect x="620" y="535" width="130" height="80" rx="6"/>
    <circle cx="700" cy="720" r="36"/><circle cx="930" cy="720" r="36"/>
    <!-- truck 3 -->
    <rect x="1080" y="600" width="360" height="110" rx="6"/>
    <rect x="1320" y="560" width="120" height="70" rx="6"/>
    <circle cx="1150" cy="720" r="34"/><circle cx="1370" cy="720" r="34"/>
  </g>
  <!-- raised booms on trucks -->
  <g stroke="#12324e" stroke-width="16" stroke-linecap="round">
    <line x1="560" y1="600" x2="880" y2="330"/>
    <line x1="1040" y1="590" x2="760" y2="320"/>
  </g>
  <g stroke="#2f88cf" stroke-width="4" opacity="0.5" stroke-linecap="round">
    <line x1="560" y1="600" x2="880" y2="330"/>
    <line x1="1040" y1="590" x2="760" y2="320"/>
  </g>
</svg>
